<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payment Receipt | DigiMarket</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;

            color: white;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    #253b80 0%,
                    transparent 32%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    #6a1b9a 0%,
                    transparent 32%
                ),
                linear-gradient(
                    135deg,
                    #07152f,
                    #101c3d,
                    #170d32
                );
        }


        /* ================= RECEIPT CARD ================= */

        .receipt-card {

            width: 100%;

            max-width: 560px;

            padding: 35px;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid rgba(255,255,255,0.15);

            border-radius: 25px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 25px 60px rgba(0,0,0,0.4);
        }


        /* ================= HEADER ================= */

        .receipt-header {

            text-align: center;

            margin-bottom: 28px;
        }


        .success-icon {

            width: 78px;

            height: 78px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            font-size: 40px;

            background:
                linear-gradient(
                    135deg,
                    #00c853,
                    #00a152
                );

            box-shadow:
                0 10px 30px rgba(0,200,83,0.25);

            animation: successPop 0.6s ease;
        }


        .receipt-header h1 {

            font-size: 28px;

            margin-bottom: 8px;

            background:
                linear-gradient(
                    90deg,
                    #00e5ff,
                    #7c4dff,
                    #d500f9
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .receipt-header p {

            color: #cbd5e1;

            font-size: 14px;
        }


        /* ================= RECEIPT BODY ================= */

        .receipt-body {

            padding: 22px;

            border-radius: 18px;

            background:
                rgba(0,0,0,0.18);

            border:
                1px solid rgba(255,255,255,0.1);
        }


        .receipt-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            padding: 15px 5px;

            border-bottom:
                1px solid rgba(255,255,255,0.1);
        }


        .receipt-row:last-child {

            border-bottom: none;
        }


        .receipt-label {

            color: #94a3b8;

            font-size: 14px;
        }


        .receipt-value {

            color: #e0f2fe;

            font-size: 14px;

            font-weight: 600;

            text-align: right;

            word-break: break-word;
        }


        /* AMOUNT */

        .amount-value {

            color: #67e8f9;

            font-size: 20px;

            font-weight: 700;
        }


        /* STATUS */

        .paid-status {

            display: inline-block;

            padding: 6px 12px;

            border-radius: 20px;

            color: #4ade80;

            background:
                rgba(34,197,94,0.12);

            border:
                1px solid rgba(74,222,128,0.2);

            font-size: 12px;

            font-weight: 700;
        }


        /* TRANSACTION ID */

        .transaction-id {

            color: #c4b5fd;

            font-size: 12px;

        }


        /* ================= THANK YOU ================= */

        .thank-you {

            margin-top: 25px;

            padding: 15px;

            text-align: center;

            border-radius: 12px;

            color: #bae6fd;

            background:
                rgba(0,229,255,0.07);

            border:
                1px solid rgba(0,229,255,0.12);
        }


        /* ================= BUTTONS ================= */

        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 25px;
        }


        .buttons a,
        .buttons button {

            flex: 1;

            padding: 13px;

            text-align: center;

            text-decoration: none;

            border: none;

            border-radius: 11px;

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }


        .dashboard-btn {

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid rgba(255,255,255,0.15) !important;
        }


        .campaign-btn {

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #7c4dff
                );
        }


        .print-btn {

            width: 100%;

            margin-top: 12px;

            padding: 12px;

            border: none;

            border-radius: 11px;

            color: white;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid rgba(255,255,255,0.12);

            cursor: pointer;

            transition: 0.3s;
        }


        .buttons a:hover,
        .buttons button:hover,
        .print-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(0,0,0,0.25);
        }


        /* ================= ANIMATION ================= */

        @keyframes successPop {

            0% {

                transform: scale(0);

                opacity: 0;
            }

            70% {

                transform: scale(1.15);
            }

            100% {

                transform: scale(1);

                opacity: 1;
            }
        }


        /* ================= PRINT ================= */

        @media print {

            body {

                background: white;

                color: black;

                padding: 0;
            }

            .receipt-card {

                max-width: 700px;

                color: black;

                background: white;

                border: 1px solid #ddd;

                box-shadow: none;
            }

            .receipt-header h1 {

                color: #111;

                -webkit-text-fill-color: #111;
            }

            .receipt-body {

                background: white;

                border: 1px solid #ddd;
            }

            .receipt-label {

                color: #555;
            }

            .receipt-value {

                color: #111;
            }

            .buttons,
            .print-btn {

                display: none;
            }

            .thank-you {

                color: #166534;

                background: #f0fdf4;

                border: 1px solid #bbf7d0;
            }
        }


        /* ================= MOBILE ================= */

        @media(max-width: 550px) {

            body {

                padding: 15px;
            }

            .receipt-card {

                padding: 22px 18px;
            }

            .receipt-header h1 {

                font-size: 24px;
            }

            .receipt-row {

                align-items: flex-start;

                flex-direction: column;

                gap: 5px;
            }

            .receipt-value {

                text-align: left;
            }

            .buttons {

                flex-direction: column;
            }
        }

    </style>

</head>


<body>


    <!-- RECEIPT -->

    <div class="receipt-card">


        <!-- HEADER -->

        <div class="receipt-header">

            <div class="success-icon">
                ✓
            </div>

            <h1>
                Payment Receipt
            </h1>

            <p>
                DigiMarket Campaign Management System
            </p>

        </div>


        <!-- RECEIPT DETAILS -->

        <div class="receipt-body">


            <!-- CAMPAIGN -->

            <div class="receipt-row">

                <span class="receipt-label">
                    📢 Campaign ID
                </span>

                <span
                    class="receipt-value"
                    id="campaignId"
                >
                    -
                </span>

            </div>


            <!-- AMOUNT -->

            <div class="receipt-row">

                <span class="receipt-label">
                    💰 Amount
                </span>

                <span
                    class="receipt-value amount-value"
                    id="amount"
                >
                    ₹0
                </span>

            </div>


            <!-- METHOD -->

            <div class="receipt-row">

                <span class="receipt-label">
                    💳 Payment Method
                </span>

                <span
                    class="receipt-value"
                    id="paymentMethod"
                >
                    -
                </span>

            </div>


            <!-- STATUS -->

            <div class="receipt-row">

                <span class="receipt-label">
                    🔐 Payment Status
                </span>

                <span class="paid-status">
                    PAID ✓
                </span>

            </div>


            <!-- DATE -->

            <div class="receipt-row">

                <span class="receipt-label">
                    📅 Payment Date
                </span>

                <span
                    class="receipt-value"
                    id="paymentDate"
                >
                    -
                </span>

            </div>


            <!-- TRANSACTION -->

            <div class="receipt-row">

                <span class="receipt-label">
                    🔖 Transaction ID
                </span>

                <span
                    class="receipt-value transaction-id"
                    id="transactionId"
                >
                    -
                </span>

            </div>


        </div>


        <!-- THANK YOU -->

        <div class="thank-you">

            🎉 Thank you for your payment!

            <br>

            Your campaign payment has been completed successfully.

        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <a
                href="dashboard.html"
                class="dashboard-btn"
            >
                🏠 Dashboard
            </a>


            <a
                href="view-campaign.html"
                class="campaign-btn"
            >
                📋 View Campaign
            </a>

        </div>


        <!-- PRINT -->

        <button
            class="print-btn"
            onclick="window.print()"
        >
            🖨️ Print Receipt
        </button>


    </div>


    <!-- SCRIPT -->

    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );


        /* CAMPAIGN ID */

        const campaignId =
            params.get("campaignId");

        document.getElementById(
            "campaignId"
        ).innerText =
            campaignId || "-";


        /* AMOUNT */

        const amount =
            params.get("amount");

        document.getElementById(
            "amount"
        ).innerText =
            amount
                ? "₹" + amount
                : "₹0";


        /* PAYMENT METHOD */

        const method =
            params.get("method");

        document.getElementById(
            "paymentMethod"
        ).innerText =
            method || "-";


        /* DATE */

        document.getElementById(
            "paymentDate"
        ).innerText =
            new Date().toLocaleDateString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"
                }
            );


        /* TRANSACTION ID */

        document.getElementById(
            "transactionId"
        ).innerText =
            "TXN" + Date.now();

    </script>


</body>

</html>
