<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Expense List</h1>
</header>

<div class="dashboard">

    <h2>All Expenses</h2>

    <table id="expenseTable" border="1" cellpadding="10" cellspacing="0">

        <thead>
            <tr>
                <th>ID</th>
                <th>Expense Name</th>
                <th>Amount</th>
            </tr>
        </thead>

        <tbody>

        </tbody>

    </table>

    <br>

    <a href="budget.html">⬅ Back to Budget</a>

</div>
<script>

fetch("/expenses")

.then(response => response.json())

.then(data => {
    console.log(data);

    let tableBody = document.querySelector("#expenseTable tbody");

    tableBody.innerHTML = "";

    data.forEach(expense => {

        tableBody.innerHTML += `
        <tr>
            <td>${expense.id}</td>
            <td>${expense.expense_name}</td>
            <td>₹${expense.amount}</td>
        </tr>
        `;

    });

})

.catch(error => console.log(error));

</script>

<script src="script.js"></script>

</body>
</html>
