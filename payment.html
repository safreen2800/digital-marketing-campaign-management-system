
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Campaign Payment | DigiMarket</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;

            color: white;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    #253b80 0%,
                    transparent 32%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    #6a1b9a 0%,
                    transparent 32%
                ),

                linear-gradient(
                    135deg,
                    #07152f,
                    #101c3d,
                    #170d32
                );

            overflow-x: hidden;
        }


        body::before {

            content: "";

            position: fixed;

            width: 300px;

            height: 300px;

            top: -100px;

            left: -80px;

            background: #00c6ff;

            filter: blur(140px);

            opacity: 0.15;

            z-index: -1;
        }


        body::after {

            content: "";

            position: fixed;

            width: 350px;

            height: 350px;

            bottom: -120px;

            right: -100px;

            background: #a855f7;

            filter: blur(150px);

            opacity: 0.15;

            z-index: -1;
        }


        /* ================= PAYMENT CARD ================= */

        .payment-card {

            width: 100%;

            max-width: 520px;

            padding: 35px;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid rgba(255,255,255,0.15);

            border-radius: 25px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 25px 60px rgba(0,0,0,0.4);
        }


        /* ================= HEADER ================= */

        .payment-header {

            text-align: center;

            margin-bottom: 25px;
        }


        .payment-icon {

            width: 75px;

            height: 75px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            font-size: 35px;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #7c4dff
                );

            box-shadow:
                0 10px 30px rgba(0,198,255,0.25);
        }


        .payment-header h1 {

            font-size: 27px;

            margin-bottom: 8px;

            background:
                linear-gradient(
                    90deg,
                    #00e5ff,
                    #7c4dff,
                    #d500f9
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .payment-header p {

            color: #cbd5e1;

            font-size: 14px;
        }


        /* ================= SUMMARY ================= */

        .payment-summary {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-bottom: 20px;
        }


        .summary-box {

            padding: 15px 8px;

            text-align: center;

            border-radius: 14px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid rgba(255,255,255,0.12);
        }


        .summary-box span {

            display: block;

            color: #aebbd0;

            font-size: 12px;

            margin-bottom: 7px;
        }


        .summary-box strong {

            font-size: 17px;

            color: white;
        }


        #remainingAmount {

            color: #facc15;
        }


        /* ================= STATUS ================= */

        .payment-status {

            text-align: center;

            margin-bottom: 20px;

            padding: 11px;

            border-radius: 12px;

            font-size: 13px;

            font-weight: 600;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid rgba(255,255,255,0.12);
        }


        /* ================= INFO ================= */

        .payment-info {

            margin-bottom: 20px;

            padding: 13px;

            border-radius: 12px;

            background:
                rgba(0,198,255,0.08);

            border:
                1px solid rgba(0,198,255,0.18);

            color: #bae6fd;

            font-size: 13px;

            line-height: 1.5;
        }


        /* ================= FORM ================= */

        .form-group {

            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #dbeafe;

            font-size: 14px;

            font-weight: 600;
        }


        input,
        select {

            width: 100%;

            padding: 14px 15px;

            border-radius: 12px;

            border:
                1px solid rgba(255,255,255,0.18);

            outline: none;

            background:
                rgba(255,255,255,0.09);

            color: white;

            font-size: 14px;

            transition: 0.3s;
        }


        input::placeholder {

            color: #b8c3d6;
        }


        input:focus,
        select:focus {

            border-color: #00e5ff;

            background:
                rgba(255,255,255,0.12);

            box-shadow:
                0 0 15px rgba(0,229,255,0.22);
        }


        select option {

            color: #111827;

            background: white;
        }


        #campaignId {

            color: #67e8f9;

            font-weight: 600;

            cursor: not-allowed;
        }


        /* ================= PAY BUTTON ================= */

        .pay-btn {

            width: 100%;

            padding: 15px;

            margin-top: 5px;

            border: none;

            border-radius: 13px;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #7c4dff,
                    #d500f9
                );

            transition: 0.3s;
        }


        .pay-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 15px 30px
                rgba(0,198,255,0.25);
        }


        .pay-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }


        /* ================= BACK ================= */

        .back-btn {

            display: block;

            width: fit-content;

            margin: 22px auto 0;

            padding: 11px 18px;

            text-decoration: none;

            color: #dbeafe;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid rgba(255,255,255,0.14);

            transition: 0.3s;
        }


        .back-btn:hover {

            border-color: #00e5ff;

            background:
                rgba(0,229,255,0.1);
        }


        /* ================= SUCCESS POPUP ================= */

        .popup-overlay {

            display: none;

            position: fixed;

            inset: 0;

            align-items: center;

            justify-content: center;

            background:
                rgba(0,0,0,0.7);

            backdrop-filter: blur(8px);

            z-index: 9999;
        }


        .popup {

            width: 90%;

            max-width: 370px;

            padding: 35px;

            text-align: center;

            border-radius: 22px;

            background: white;

            color: #172033;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.5);

            animation:
                popupIn 0.35s ease;
        }


        .success-icon {

            width: 70px;

            height: 70px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #dcfce7;

            color: #16a34a;

            font-size: 38px;
        }


        .popup h2 {

            margin-bottom: 10px;
        }


        .popup p {

            color: #64748b;

            margin-bottom: 20px;

            line-height: 1.5;
        }


        .popup button {

            border: none;

            padding: 11px 25px;

            border-radius: 10px;

            color: white;

            font-weight: 600;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #7c4dff
                );
        }


        @keyframes popupIn {

            from {

                transform: scale(0.7);

                opacity: 0;
            }

            to {

                transform: scale(1);

                opacity: 1;
            }
        }


        /* ================= MOBILE ================= */

        @media(max-width:550px) {

            body {

                padding: 15px;
            }


            .payment-card {

                padding: 25px 20px;
            }


            .payment-header h1 {

                font-size: 23px;
            }


            .payment-summary {

                grid-template-columns:
                    1fr;
            }

        }

    </style>

</head>


<body>


    <!-- ================= PAYMENT CARD ================= -->

    <div class="payment-card">


        <!-- HEADER -->

        <div class="payment-header">

            <div class="payment-icon">
                💳
            </div>

            <h1>
                Campaign Payment
            </h1>

            <p>
                Complete payment to launch your campaign
            </p>

        </div>



        <!-- ================= SUMMARY ================= -->

        <div class="payment-summary">


            <div class="summary-box">

                <span>
                    Total Amount
                </span>

                <strong id="totalAmount">
                    ₹0
                </strong>

            </div>


            <div class="summary-box">

                <span>
                    Already Paid
                </span>

                <strong id="paidAmount">
                    ₹0
                </strong>

            </div>


            <div class="summary-box">

                <span>
                    Remaining
                </span>

                <strong id="remainingAmount">
                    ₹0
                </strong>

            </div>


        </div>



        <!-- STATUS -->

        <div
            class="payment-status"
            id="paymentStatus">

            Payment Status: NOT PAID

        </div>



        <!-- INFO -->

        <div
            class="payment-info"
            id="paymentInfo">

            Loading payment details...

        </div>



        <!-- ================= FORM ================= -->

        <form id="paymentForm">


            <!-- CAMPAIGN ID -->

            <div class="form-group">

                <label for="campaignId">

                    📢 Campaign ID

                </label>


                <input
                    type="number"
                    id="campaignId"
                    readonly
                    required
                >

            </div>



            <!-- AMOUNT -->

            <div class="form-group">

                <label for="amount">

                    💰 Amount to Pay (₹)

                </label>


                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="1"
                    step="0.01"
                    required
                >

            </div>



            <!-- PAYMENT METHOD -->

            <div class="form-group">

                <label for="paymentMethod">

                    💳 Payment Method

                </label>


                <select
                    id="paymentMethod"
                    required>

                    <option value="">
                        Select Payment Method
                    </option>

                    <option value="UPI">
                        📱 UPI
                    </option>

                    <option value="Credit Card">
                        💳 Credit Card
                    </option>

                    <option value="Debit Card">
                        💳 Debit Card
                    </option>

                    <option value="Net Banking">
                        🏦 Net Banking
                    </option>

                </select>

            </div>



            <!-- PAY BUTTON -->

            <button
                type="submit"
                class="pay-btn"
                id="payButton">

                💳 Pay Now

            </button>


        </form>



        <!-- BACK -->

        <a
            href="view-campaign.html"
            class="back-btn">

            ⬅ Back to Campaigns

        </a>


    </div>



    <!-- ================= SUCCESS POPUP ================= -->

    <div
        class="popup-overlay"
        id="successPopup">


        <div class="popup">


            <div class="success-icon">

                ✓

            </div>


            <h2 id="popupTitle">

                Payment Successful!

            </h2>


            <p id="popupMessage">

                Payment has been successfully recorded.

            </p>


            <button
                onclick="goToReceipt()">

                View Receipt →

            </button>


        </div>


    </div>
<


   <script>

    /* ==========================================
       GET CAMPAIGN ID
    ========================================== */

    const params = new URLSearchParams(
        window.location.search
    );

    const campaignId = params.get("campaignId");

    const campaignInput =
        document.getElementById("campaignId");

    if (campaignId) {
        campaignInput.value = campaignId;
    }


    /* ==========================================
       PAYMENT VARIABLES
    ========================================== */

    let totalAmount = 0;
    let paidAmount = 0;
    let remainingAmount = 0;

    let lastPaymentAmount = 0;
    let lastPaymentMethod = "";


    /* ==========================================
       MONEY FORMAT
    ========================================== */

    function money(amount) {

        return "₹" +
            Number(amount).toLocaleString(
                "en-IN",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );

    }


    /* ==========================================
       UPDATE SCREEN
    ========================================== */

    function updateScreen() {

        remainingAmount = Math.max(
            totalAmount - paidAmount,
            0
        );


        document.getElementById(
            "totalAmount"
        ).innerText = money(totalAmount);


        document.getElementById(
            "paidAmount"
        ).innerText = money(paidAmount);


        document.getElementById(
            "remainingAmount"
        ).innerText =
            money(remainingAmount);


        const status =
            document.getElementById(
                "paymentStatus"
            );


        const info =
            document.getElementById(
                "paymentInfo"
            );


        const amountInput =
            document.getElementById(
                "amount"
            );


        const payButton =
            document.getElementById(
                "payButton"
            );


        /* ======================================
           FULLY PAID
        ====================================== */

        if (remainingAmount <= 0) {

            status.innerText =
                "✓ Payment Status: FULLY PAID";

            status.style.color =
                "#22c55e";


            info.innerText =
                "✓ Full payment completed. Your campaign is ready for launch.";


            amountInput.disabled = true;

            amountInput.value = "";


            payButton.disabled = true;

            payButton.innerText =
                "✓ Fully Paid";

            return;
        }


        /* ======================================
           PARTIAL PAYMENT
        ====================================== */

        if (paidAmount > 0) {

            status.innerText =
                "Payment Status: PARTIALLY PAID";

            status.style.color =
                "#facc15";


            info.innerText =
                money(remainingAmount) +
                " remaining. Complete the remaining payment before launching the campaign.";


            amountInput.disabled = false;

            amountInput.max =
                remainingAmount;


            /*
             * After first payment,
             * automatically show remaining amount.
             */

            amountInput.value =
                remainingAmount;


            payButton.disabled = false;

            payButton.innerText =
                "💳 Pay Remaining";

            return;
        }


        /* ======================================
           NOT PAID - FIRST PAYMENT
        ====================================== */

        status.innerText =
            "Payment Status: NOT PAID";

        status.style.color =
            "#f87171";


        info.innerText =
            "Total campaign amount is " +
            money(totalAmount) +
            ". First payment is ₹5,000. Full payment is required before campaign launch.";


        amountInput.disabled = false;

        amountInput.max =
            remainingAmount;


        /*
         * FIRST PAYMENT = ₹5000
         */

        if (remainingAmount >= 5000) {

            amountInput.value = 5000;

        } else {

            amountInput.value =
                remainingAmount;

        }


        payButton.disabled = false;

        payButton.innerText =
            "💳 Pay ₹5,000";

    }


    /* ==========================================
       LOAD REAL PAYMENT DATA FROM SERVER
    ========================================== */

    async function loadPayment() {

        if (!campaignId) {

            alert(
                "Campaign ID is missing!"
            );

            return;

        }


        try {

            /*
             * Get actual campaign payment
             * from MySQL
             */

            const response =
                await fetch(
                    `/campaign-payment/${campaignId}`
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Unable to load payment details"
                );

            }


            /*
             * IMPORTANT:
             * Use DATABASE values
             */

            totalAmount =
                Number(
                    data.totalAmount
                ) || 0;


            paidAmount =
                Number(
                    data.totalPaid
                ) || 0;


            remainingAmount =
                Number(
                    data.remainingAmount
                ) || 0;


            console.log(
                "Payment Details:",
                data
            );


            updateScreen();

        }

        catch (error) {

            console.error(
                "Payment Load Error:",
                error
            );


            alert(
                "Unable to load payment details."
            );

        }

    }


    /* ==========================================
       AMOUNT INPUT
    ========================================== */

    document
        .getElementById("amount")
        .addEventListener(
            "input",
            function () {

                let value =
                    Number(this.value);


                /*
                 * Cannot pay more than remaining
                 */

                if (
                    value >
                    remainingAmount
                ) {

                    this.value =
                        remainingAmount;

                }


                if (value < 0) {

                    this.value = 0;

                }

            }
        );


    /* ==========================================
       PAYMENT SUBMIT
    ========================================== */

    document
        .getElementById("paymentForm")
        .addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const amount =
                    Number(
                        document
                            .getElementById(
                                "amount"
                            )
                            .value
                    );


                const paymentMethod =
                    document
                        .getElementById(
                            "paymentMethod"
                        )
                        .value;


                const payButton =
                    document.getElementById(
                        "payButton"
                    );


                /* ==================================
                   VALIDATION
                ================================== */

                if (!campaignId) {

                    alert(
                        "Campaign ID is missing!"
                    );

                    return;

                }


                if (
                    !amount ||
                    amount <= 0
                ) {

                    alert(
                        "Please enter a valid payment amount."
                    );

                    return;

                }


                if (
                    amount >
                    remainingAmount
                ) {

                    alert(
                        "Maximum payable amount is " +
                        money(
                            remainingAmount
                        )
                    );

                    return;

                }


                if (!paymentMethod) {

                    alert(
                        "Please select a payment method."
                    );

                    return;

                }


                /* ==================================
                   FIRST PAYMENT RULE
                ================================== */

                /*
                 * If nothing has been paid yet,
                 * first payment should be ₹5000.
                 */

                if (
                    paidAmount === 0 &&
                    totalAmount >= 5000 &&
                    amount !== 5000
                ) {

                    alert(
                        "First payment must be ₹5,000."
                    );

                    document.getElementById(
                        "amount"
                    ).value = 5000;

                    return;

                }


                /* ==================================
                   PROCESSING
                ================================== */

                payButton.disabled = true;

                payButton.innerText =
                    "⏳ Processing Payment...";


                try {

                    const response =
                        await fetch(
                            "/payment",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        campaignId:
                                            campaignId,

                                        amount:
                                            amount,

                                        paymentMethod:
                                            paymentMethod

                                    })

                            }
                        );


                    /*
                     * Your server now returns JSON
                     */

                    const data =
                        await response.json();


                    console.log(
                        "Payment Response:",
                        data
                    );


                    /* ==================================
                       PAYMENT SUCCESS
                    ================================== */

                    if (response.ok) {


                        totalAmount =
                            Number(
                                data.totalAmount
                            ) || totalAmount;


                        paidAmount =
                            Number(
                                data.totalPaid
                            ) || 0;


                        remainingAmount =
                            Number(
                                data.remainingAmount
                            ) || 0;


                        lastPaymentAmount =
                            Number(
                                data.currentPayment
                            ) || amount;


                        lastPaymentMethod =
                            data.paymentMethod ||
                            paymentMethod;


                        /*
                         * Save latest payment only
                         * for receipt
                         */

                        localStorage.setItem(

                            "campaignPayment_" +
                            campaignId,

                            JSON.stringify({

                                campaignId:
                                    campaignId,

                                totalAmount:
                                    totalAmount,

                                paidAmount:
                                    paidAmount,

                                remainingAmount:
                                    remainingAmount,

                                lastPayment:
                                    lastPaymentAmount,

                                paymentMethod:
                                    lastPaymentMethod,

                                paymentDate:
                                    new Date()
                                        .toLocaleString(
                                            "en-IN"
                                        )

                            })

                        );


                        updateScreen();


                        /* ==================================
                           SUCCESS POPUP
                        ================================== */

                        document.getElementById(
                            "successPopup"
                        ).style.display =
                            "flex";


                        if (
                            remainingAmount === 0
                        ) {

                            document.getElementById(
                                "popupTitle"
                            ).innerText =
                                "Full Payment Successful!";


                            document.getElementById(
                                "popupMessage"
                            ).innerText =

                                money(amount) +
                                " paid successfully. " +

                                "Total payment of " +
                                money(totalAmount) +
                                " is completed. " +

                                "Campaign is now ready for launch.";

                        }

                        else {

                            document.getElementById(
                                "popupTitle"
                            ).innerText =
                                "Payment Successful!";


                            document.getElementById(
                                "popupMessage"
                            ).innerText =

                                money(amount) +
                                " paid successfully.\n\n" +

                                "Remaining amount: " +
                                money(
                                    remainingAmount
                                );

                        }


                        /*
                         * Clear payment method
                         */

                        document.getElementById(
                            "paymentMethod"
                        ).value = "";

                    }


                    /* ==================================
                       PAYMENT FAILED
                    ================================== */

                    else {

                        alert(
                            data.message ||
                            "Payment Failed!"
                        );


                        payButton.disabled =
                            false;


                        updateScreen();

                    }

                }

                catch (error) {

                    console.error(
                        "Payment Error:",
                        error
                    );


                    alert(
                        "Payment failed. Please make sure the server is running."
                    );


                    payButton.disabled =
                        false;


                    updateScreen();

                }

            }
        );


    /* ==========================================
       RECEIPT
    ========================================== */

    function goToReceipt() {

        const saved =
            localStorage.getItem(
                "campaignPayment_" +
                campaignId
            );


        if (!saved) {

            alert(
                "Payment information not found."
            );

            return;

        }


        const data =
            JSON.parse(saved);


        window.location.href =

            "receipt.html?" +

            "campaignId=" +
            encodeURIComponent(
                campaignId
            ) +

            "&amount=" +
            encodeURIComponent(
                data.lastPayment
            ) +

            "&method=" +
            encodeURIComponent(
                data.paymentMethod
            ) +

            "&total=" +
            encodeURIComponent(
                data.totalAmount
            ) +

            "&paid=" +
            encodeURIComponent(
                data.paidAmount
            ) +

            "&remaining=" +
            encodeURIComponent(
                data.remainingAmount
            );

    }


    /* ==========================================
       START
    ========================================== */

    loadPayment();

</script>


</body>

</html>
