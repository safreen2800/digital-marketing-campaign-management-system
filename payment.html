<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Campaign Payment | DigiMarket</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            color: white;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    #253b80 0%,
                    transparent 32%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    #6a1b9a 0%,
                    transparent 32%
                ),
                linear-gradient(
                    135deg,
                    #07152f,
                    #101c3d,
                    #170d32
                );

            overflow-x: hidden;
        }

        body::before {

            content: "";

            position: fixed;

            width: 300px;
            height: 300px;

            top: -100px;
            left: -80px;

            background: #00c6ff;

            filter: blur(140px);

            opacity: 0.15;

            z-index: -1;
        }

        body::after {

            content: "";

            position: fixed;

            width: 350px;
            height: 350px;

            bottom: -120px;
            right: -100px;

            background: #a855f7;

            filter: blur(150px);

            opacity: 0.15;

            z-index: -1;
        }


        /* ================= PAYMENT CARD ================= */

        .payment-card {

            width: 100%;

            max-width: 500px;

            padding: 35px;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid rgba(255,255,255,0.15);

            border-radius: 25px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 25px 60px rgba(0,0,0,0.4);
        }


        /* ================= HEADER ================= */

        .payment-header {

            text-align: center;

            margin-bottom: 30px;
        }

        .payment-icon {

            width: 75px;
            height: 75px;

            margin: 0 auto 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 35px;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #7c4dff
                );

            box-shadow:
                0 10px 30px rgba(0,198,255,0.25);
        }

        .payment-header h1 {

            font-size: 27px;

            margin-bottom: 8px;

            background:
                linear-gradient(
                    90deg,
                    #00e5ff,
                    #7c4dff,
                    #d500f9
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }

        .payment-header p {

            color: #cbd5e1;

            font-size: 14px;
        }


        /* ================= FORM ================= */

        .form-group {

            margin-bottom: 20px;
        }

        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #dbeafe;

            font-size: 14px;

            font-weight: 600;
        }


        input,
        select {

            width: 100%;

            padding: 14px 15px;

            border-radius: 12px;

            border:
                1px solid rgba(255,255,255,0.18);

            outline: none;

            background:
                rgba(255,255,255,0.09);

            color: white;

            font-size: 14px;

            transition: 0.3s;
        }

        input::placeholder {

            color: #b8c3d6;
        }

        input:focus,
        select:focus {

            border-color: #00e5ff;

            background:
                rgba(255,255,255,0.12);

            box-shadow:
                0 0 15px rgba(0,229,255,0.22);
        }

        select option {

            color: #111827;

            background: white;
        }


        /* READONLY CAMPAIGN ID */

        #campaignId {

            color: #67e8f9;

            font-weight: 600;

            cursor: not-allowed;
        }


        /* ================= PAY BUTTON ================= */

        .pay-btn {

            width: 100%;

            padding: 15px;

            margin-top: 5px;

            border: none;

            border-radius: 13px;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #7c4dff,
                    #d500f9
                );

            transition: 0.3s;
        }

        .pay-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 15px 30px rgba(0,198,255,0.25);
        }

        .pay-btn:disabled {

            opacity: 0.7;

            cursor: not-allowed;

            transform: none;
        }


        /* ================= BACK ================= */

        .back-btn {

            display: block;

            width: fit-content;

            margin: 22px auto 0;

            padding: 11px 18px;

            text-decoration: none;

            color: #dbeafe;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid rgba(255,255,255,0.14);

            transition: 0.3s;
        }

        .back-btn:hover {

            border-color: #00e5ff;

            background:
                rgba(0,229,255,0.1);
        }


        /* ================= SUCCESS POPUP ================= */

        .popup-overlay {

            display: none;

            position: fixed;

            inset: 0;

            align-items: center;
            justify-content: center;

            background:
                rgba(0,0,0,0.7);

            backdrop-filter: blur(8px);

            z-index: 9999;
        }

        .popup {

            width: 350px;

            padding: 35px;

            text-align: center;

            border-radius: 22px;

            background: white;

            color: #172033;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.5);

            animation:
                popupIn 0.35s ease;
        }

        .success-icon {

            width: 70px;
            height: 70px;

            margin:
                0 auto 15px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #dcfce7;

            color: #16a34a;

            font-size: 38px;
        }

        .popup h2 {

            margin-bottom: 8px;
        }

        .popup p {

            color: #64748b;

            margin-bottom: 20px;
        }

        .popup button {

            border: none;

            padding: 11px 25px;

            border-radius: 10px;

            color: white;

            font-weight: 600;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #7c4dff
                );
        }

        @keyframes popupIn {

            from {

                transform: scale(0.7);

                opacity: 0;
            }

            to {

                transform: scale(1);

                opacity: 1;
            }
        }


        /* ================= MOBILE ================= */

        @media(max-width: 550px) {

            body {

                padding: 15px;
            }

            .payment-card {

                padding: 25px 20px;
            }

            .payment-header h1 {

                font-size: 23px;
            }

        }

    </style>

</head>


<body>


    <!-- PAYMENT CARD -->

    <div class="payment-card">


        <!-- HEADER -->

        <div class="payment-header">

            <div class="payment-icon">
                💳
            </div>

            <h1>
                Campaign Payment
            </h1>

            <p>
                Complete payment to launch your campaign
            </p>

        </div>


        <!-- PAYMENT FORM -->

        <form id="paymentForm">


            <!-- CAMPAIGN ID -->

            <div class="form-group">

                <label for="campaignId">
                    📢 Campaign ID
                </label>

                <input
                    type="number"
                    id="campaignId"
                    readonly
                    required
                >

            </div>


            <!-- AMOUNT -->

            <div class="form-group">

                <label for="amount">
                    💰 Amount (₹)
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter payment amount"
                    min="1"
                    required
                >

            </div>


            <!-- PAYMENT METHOD -->

            <div class="form-group">

                <label for="paymentMethod">
                    💳 Payment Method
                </label>

                <select
                    id="paymentMethod"
                    required
                >

                    <option value="">
                        Select Payment Method
                    </option>

                    <option value="UPI">
                        📱 UPI
                    </option>

                    <option value="Credit Card">
                        💳 Credit Card
                    </option>

                    <option value="Debit Card">
                        💳 Debit Card
                    </option>

                    <option value="Net Banking">
                        🏦 Net Banking
                    </option>

                </select>

            </div>


            <!-- PAY -->

            <button
                type="submit"
                class="pay-btn"
                id="payButton"
            >
                💳 Pay Now
            </button>


        </form>


        <!-- BACK -->

        <a
            href="view-campaign.html"
            class="back-btn"
        >
            ⬅ Back to Campaigns
        </a>


    </div>


    <!-- SUCCESS POPUP -->

    <div
        class="popup-overlay"
        id="successPopup"
    >

        <div class="popup">

            <div class="success-icon">
                ✓
            </div>

            <h2>
                Payment Successful!
            </h2>

            <p>
                Your campaign payment has been completed successfully.
            </p>

            <button onclick="goToReceipt()">
                View Receipt →
            </button>

        </div>

    </div>


    <script>

        /* ================= CAMPAIGN ID ================= */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const campaignId =
            params.get("campaignId");


        if (campaignId) {

            document.getElementById(
                "campaignId"
            ).value = campaignId;

        }


        /* ================= PAYMENT ================= */

        document
            .getElementById("paymentForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const campaignId =
                        document.getElementById(
                            "campaignId"
                        ).value;

                    const amount =
                        document.getElementById(
                            "amount"
                        ).value;

                    const paymentMethod =
                        document.getElementById(
                            "paymentMethod"
                        ).value;


                    if (!campaignId) {

                        alert(
                            "Campaign ID is missing!"
                        );

                        return;
                    }


                    const payButton =
                        document.getElementById(
                            "payButton"
                        );


                    payButton.disabled = true;

                    payButton.innerText =
                        "⏳ Processing Payment...";


                    try {

                        const response =
                            await fetch(
                                "/payment",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({

                                            campaignId:
                                                campaignId,

                                            amount:
                                                amount,

                                            paymentMethod:
                                                paymentMethod

                                        })
                                }
                            );


                        const data =
                            await response.text();


                        console.log(
                            "Payment Response:",
                            data
                        );


                        if (
                            response.ok &&
                            data.includes(
                                "Payment Successful"
                            )
                        ) {

                            /* SHOW SUCCESS */

                            document.getElementById(
                                "successPopup"
                            ).style.display = "flex";


                        } else {

                            alert(
                                data ||
                                "Payment Failed!"
                            );

                            payButton.disabled =
                                false;

                            payButton.innerText =
                                "💳 Pay Now";
                        }


                    } catch(error) {

                        console.error(error);

                        alert(
                            "Payment Failed! Please try again."
                        );

                        payButton.disabled =
                            false;

                        payButton.innerText =
                            "💳 Pay Now";

                    }

                }
            );


        /* ================= RECEIPT ================= */

        function goToReceipt() {

            const campaignId =
                document.getElementById(
                    "campaignId"
                ).value;

            const amount =
                document.getElementById(
                    "amount"
                ).value;

            const paymentMethod =
                document.getElementById(
                    "paymentMethod"
                ).value;


            window.location.href =
                `receipt.html?campaignId=${encodeURIComponent(campaignId)}&amount=${encodeURIComponent(amount)}&method=${encodeURIComponent(paymentMethod)}`;

        }

    </script>


</body>

</html>
