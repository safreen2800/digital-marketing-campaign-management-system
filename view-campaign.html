<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Campaigns | Digital Campaign Management</title>
    <script src="auth.js"></script>

<script>
    protectPage();
</script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            padding: 35px;
            color: white;

            background:
                radial-gradient(circle at top left, #253b80 0%, transparent 35%),
                radial-gradient(circle at bottom right, #6a1b9a 0%, transparent 35%),
                linear-gradient(135deg, #07152f, #101c3d, #170d32);

            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;

            background: #00c6ff;
            filter: blur(130px);
            opacity: 0.15;

            top: -100px;
            left: -80px;

            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;

            background: #a855f7;
            filter: blur(150px);
            opacity: 0.15;

            bottom: -120px;
            right: -100px;

            z-index: -1;
        }

        /* HEADER */

        .top-section {
            max-width: 1400px;
            margin: 0 auto 30px;
            text-align: center;
        }

        .top-section h1 {
            font-size: 34px;
            margin-bottom: 8px;

            background:
                linear-gradient(
                    90deg,
                    #00e5ff,
                    #7c4dff,
                    #d500f9
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .top-section p {
            color: #cbd5e1;
            font-size: 15px;
        }

        /* SEARCH */

        .search-box {
            max-width: 1400px;
            margin: 0 auto 30px;

            padding: 22px;

            display: flex;
            gap: 15px;
            align-items: center;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.15);

            border-radius: 18px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 15px 40px rgba(0,0,0,0.25);
        }

        .search-box input,
        .search-box select {

            height: 48px;

            padding: 0 16px;

            border-radius: 12px;

            border:
                1px solid rgba(255,255,255,0.2);

            outline: none;

            background:
                rgba(255,255,255,0.1);

            color: white;

            font-size: 14px;
        }

        .search-box input {
            flex: 1;
        }

        .search-box select {
            width: 210px;
        }

        .search-box input::placeholder {
            color: #b8c3d6;
        }

        .search-box input:focus,
        .search-box select:focus {

            border-color: #00e5ff;

            box-shadow:
                0 0 15px rgba(0,229,255,0.25);
        }

        .search-box select option {
            color: #111827;
            background: white;
        }

        /* TABLE */

        .table-card {

            max-width: 1400px;

            margin: auto;

            padding: 20px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid rgba(255,255,255,0.14);

            border-radius: 20px;

            backdrop-filter: blur(18px);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.3);

            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }

        thead {
            background:
                rgba(0,229,255,0.12);
        }

        th {

            padding: 16px 12px;

            color: #67e8f9;

            font-size: 13px;

            white-space: nowrap;

            border-bottom:
                1px solid rgba(255,255,255,0.15);
        }

        td {

            padding: 14px 12px;

            text-align: center;

            color: #e2e8f0;

            font-size: 13px;

            border-bottom:
                1px solid rgba(255,255,255,0.08);
        }

        tbody tr {
            transition: 0.25s;
        }

        tbody tr:hover {

            background:
                rgba(255,255,255,0.08);

            transform: scale(1.002);
        }

        /* BUTTONS */

        button {

            border: none;

            cursor: pointer;

            border-radius: 9px;

            padding: 9px 13px;

            font-weight: 600;

            transition: 0.25s;
        }

        .edit-btn {

            background:
                linear-gradient(
                    135deg,
                    #2196f3,
                    #3f51b5
                );

            color: white;
        }

        .delete-btn {

            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #be123c
                );

            color: white;
        }

        .pay-btn {

            background:
                linear-gradient(
                    135deg,
                    #00c853,
                    #00a152
                );

            color: white;
        }

        .launch-btn {

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #7c4dff
                );

            color: white;
        }

        .launch-btn:disabled {

            background: #475569;

            color: #94a3b8;

            cursor: not-allowed;

            opacity: 0.65;
        }

        button:hover:not(:disabled) {

            transform: translateY(-2px);

            box-shadow:
                0 7px 18px rgba(0,0,0,0.3);
        }

        /* STATUS */

        .status {

            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 700;
        }

        .status.active {

            background:
                rgba(34,197,94,0.15);

            color: #4ade80;
        }

        .status.completed {

            background:
                rgba(59,130,246,0.15);

            color: #60a5fa;
        }

        .status.pending {

            background:
                rgba(234,179,8,0.15);

            color: #facc15;
        }

        .status.launched {

            background:
                rgba(0,229,255,0.15);

            color: #22d3ee;
        }

        /* BOTTOM */

        .bottom-section {

            max-width: 1400px;

            margin: 30px auto 0;

            display: flex;

            justify-content: space-between;

            gap: 15px;
        }

        .nav-btn {

            text-decoration: none;

            color: white;

            padding: 13px 20px;

            border-radius: 12px;

            background:
                rgba(255,255,255,0.09);

            border:
                1px solid rgba(255,255,255,0.15);

            transition: 0.25s;
        }

        .nav-btn:hover {

            background:
                rgba(0,229,255,0.15);

            border-color: #00e5ff;

            transform: translateY(-2px);
        }

        .add-btn {

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #7c4dff
                );

            border: none;
        }

        /* POPUP */

        .popup-overlay {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.70);

            backdrop-filter: blur(8px);

            align-items: center;

            justify-content: center;

            z-index: 9999;

            padding: 20px;
        }

        .popup {

            width: 380px;

            max-width: 100%;

            padding: 35px;

            text-align: center;

            border-radius: 22px;

            background: white;

            color: #172033;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.5);

            animation:
                popupIn 0.35s ease;
        }

        .popup-icon {

            width: 75px;

            height: 75px;

            margin: auto auto 15px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 38px;

            background: #dcfce7;

            color: #16a34a;
        }

        .popup.warning .popup-icon {

            background: #fef3c7;

            color: #d97706;
        }

        .popup.error .popup-icon {

            background: #fee2e2;

            color: #dc2626;
        }

        .popup h2 {

            margin-bottom: 10px;

            font-size: 22px;
        }

        .popup p {

            color: #64748b;

            margin-bottom: 22px;

            line-height: 1.6;
        }

        .popup button {

            background:
                linear-gradient(
                    135deg,
                    #00c6ff,
                    #7c4dff
                );

            color: white;

            padding: 11px 28px;
        }

        @keyframes popupIn {

            from {

                transform: scale(0.7);

                opacity: 0;
            }

            to {

                transform: scale(1);

                opacity: 1;
            }
        }

        /* RESPONSIVE */

        @media(max-width:700px) {

            body {
                padding: 20px;
            }

            .top-section h1 {
                font-size: 26px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box input,
            .search-box select {
                width: 100%;
            }

            .bottom-section {
                flex-direction: column;
            }

            .nav-btn {
                text-align: center;
            }
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="top-section">

        <h1>📊 Campaign Management</h1>

        <p>
            View, manage, pay and launch your digital campaigns
        </p>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search by Campaign Name or Platform..."
        >

        <select id="platformFilter">

            <option value="All">
                All Platforms
            </option>

            <option value="Instagram">
                Instagram
            </option>

            <option value="Facebook">
                Facebook
            </option>

            <option value="YouTube">
                YouTube
            </option>

            <option value="LinkedIn">
                LinkedIn
            </option>

        </select>

    </div>


    <!-- CAMPAIGN TABLE -->

    <div class="table-card">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Campaign Name</th>

                    <th>Platform</th>

                    <th>Budget</th>

                    <th>Status</th>

                    <th>Ad Preview</th>

                    <th>Progress</th>

                    <th>Impressions</th>

                    <th>Clicks</th>

                    <th>Views</th>

                    <th>Reach</th>

                    <th>Action</th>

                    <th>Payment</th>

                    <th>Launch</th>

                </tr>

            </thead>


            <tbody id="campaignTable">

            </tbody>

        </table>

    </div>


    <!-- BOTTOM BUTTONS -->

    <div class="bottom-section">

        <a
            href="dashboard.html"
            class="nav-btn"
        >
            ⬅ Back to Dashboard
        </a>


        <a
            href="campaign.html"
            class="nav-btn add-btn"
        >
            ➕ Add New Campaign
        </a>

    </div>


    <!-- POPUP -->

    <div
        class="popup-overlay"
        id="successPopup"
    >

        <div
            class="popup"
            id="popupBox"
        >

            <div
                class="popup-icon"
                id="popupIcon"
            >
                ✓
            </div>


            <h2 id="popupTitle">
                Success!
            </h2>


            <p id="popupMessage">
                Operation completed successfully.
            </p>


            <button onclick="closePopup()">
                OK
            </button>

        </div>

    </div>


    <script>

        /* =====================================
           POPUP
        ===================================== */

        function showPopup(
            title,
            message,
            type = "success",
            icon = "✓"
        ) {

            const overlay =
                document.getElementById("successPopup");

            const box =
                document.getElementById("popupBox");

            const popupTitle =
                document.getElementById("popupTitle");

            const popupMessage =
                document.getElementById("popupMessage");

            const popupIcon =
                document.getElementById("popupIcon");


            popupTitle.innerText = title;

            popupMessage.innerText = message;

            popupIcon.innerText = icon;


            box.className = "popup";


            if (type === "warning") {

                box.classList.add("warning");

            }

            if (type === "error") {

                box.classList.add("error");

            }


            overlay.style.display = "flex";
        }


        function closePopup() {

            document.getElementById(
                "successPopup"
            ).style.display = "none";
        }


        /* =====================================
           MONEY FORMAT
        ===================================== */

        function formatMoney(amount) {

            const value =
                Number(amount) || 0;

            return "₹" + value.toLocaleString(
                "en-IN",
                {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }
            );
        }


        /* =====================================
           PAYMENT STATUS CHECK
        ===================================== */

        async function checkPaymentBeforeLaunch(id) {

            try {

                /*
                 * This endpoint should return:
                 *
                 * {
                 *   totalAmount: 8000,
                 *   totalPaid: 5000,
                 *   remainingAmount: 3000
                 * }
                 *
                 * If your backend uses another endpoint,
                 * change only this URL.
                 */

                const response = await fetch(
                    "/campaign-payment/" + id
                );


                if (!response.ok) {

                    throw new Error(
                        "Payment information unavailable"
                    );
                }


                const payment =
                    await response.json();


                const totalAmount =
                    Number(
                        payment.totalAmount ??
                        payment.total ??
                        payment.budget ??
                        0
                    );


                const totalPaid =
                    Number(
                        payment.totalPaid ??
                        payment.paid ??
                        0
                    );


                const remainingAmount =
                    Math.max(
                        totalAmount - totalPaid,
                        0
                    );


                /* =================================
                   PAYMENT NOT COMPLETE
                ================================= */

                if (remainingAmount > 0) {

                    showPopup(

                        "⚠️ Payment Required",

                        "Please pay the remaining " +
                        formatMoney(remainingAmount) +
                        " before launching this campaign.",

                        "warning",

                        "⚠️"
                    );

                    return false;
                }


                /* =================================
                   PAYMENT COMPLETE
                ================================= */

                showPopup(

                    "✅ Payment Completed",

                    "The complete campaign amount has been paid. Your campaign can now be launched.",

                    "success",

                    "✓"
                );


                /*
                 * Wait for user to close popup,
                 * then launch.
                 */

                return true;

            }
            catch (error) {

                console.error(
                    "Payment check error:",
                    error
                );


                showPopup(

                    "❌ Payment Check Failed",

                    "Unable to verify payment. Please try again.",

                    "error",

                    "!"
                );


                return false;
            }
        }


        /* =====================================
           LAUNCH CAMPAIGN
        ===================================== */

        async function launchCampaign(id) {

            /*
             * FIRST:
             * Check payment
             */

            const paymentComplete =
                await checkPaymentBeforeLaunch(id);


            if (!paymentComplete) {

                return;
            }


            /*
             * Wait briefly so user can see
             * payment completed popup.
             */

            setTimeout(async () => {

                try {

                    const response =
                        await fetch(
                            "/launch-campaign/" + id,
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                }
                            }
                        );


                    const result =
                        await response.text();


                    if (response.ok) {

                        showPopup(

                            "🚀 Campaign Launched!",

                            "Your campaign has been successfully launched.",

                            "success",

                            "🚀"
                        );


                        setTimeout(() => {

                            location.reload();

                        }, 1500);

                    }
                    else {

                        showPopup(

                            "❌ Launch Failed",

                            result ||
                            "Campaign could not be launched.",

                            "error",

                            "!"
                        );

                    }

                }
                catch (error) {

                    console.error(
                        "Launch error:",
                        error
                    );


                    showPopup(

                        "❌ Error",

                        "Unable to launch campaign. Please try again.",

                        "error",

                        "!"
                    );

                }

            }, 1200);

        }


        /* =====================================
           CLOSE POPUP WHEN CLICK OUTSIDE
        ===================================== */

        document
            .getElementById("successPopup")
            .addEventListener(
                "click",
                function(event) {

                    if (event.target === this) {

                        closePopup();

                    }

                }
            );

    </script>


    <!-- YOUR EXISTING CAMPAIGN JAVASCRIPT -->

    <script src="view-campaign.js"></script>


</body>

</html>
