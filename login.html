<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | DigiMarket</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #273c75, transparent 35%),
                radial-gradient(circle at bottom right, #8e44ad, transparent 35%),
                linear-gradient(135deg, #050816, #111827, #1e1b4b);

            color: white;
            overflow: hidden;
        }

        /* Background Glow */

        body::before {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            background: rgba(0, 212, 255, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            background: rgba(168, 85, 247, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            bottom: -100px;
            right: -100px;
            z-index: -1;
        }

        /* Login Container */

        .login-container {
            width: 420px;
            max-width: 92%;
            padding: 40px 35px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-radius: 25px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45),
                inset 0 1px 1px rgba(255, 255, 255, 0.08);

            animation: fadeIn 0.7s ease;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;

            background: linear-gradient(
                90deg,
                #00d4ff,
                #8b5cf6,
                #ec4899
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Form */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #e2e8f0;
        }

        .input-box {
            position: relative;
        }

        .input-box span {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        .input-box input {
            width: 100%;
            padding: 14px 15px 14px 45px;

            border-radius: 12px;

            border: 1px solid rgba(255, 255, 255, 0.15);

            outline: none;

            background: rgba(255, 255, 255, 0.08);

            color: white;

            font-size: 15px;

            transition: 0.3s;
        }

        .input-box input::placeholder {
            color: #94a3b8;
        }

        .input-box input:focus {
            border-color: #00d4ff;

            box-shadow:
                0 0 0 3px rgba(0, 212, 255, 0.12);
        }

        /* Remember */

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin: 5px 0 25px;

            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #cbd5e1;
        }

        .remember input {
            accent-color: #00d4ff;
        }

        .forgot {
            color: #00d4ff;
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* Login Button */

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 12px;

            cursor: pointer;

            color: white;

            font-size: 16px;
            font-weight: 600;

            background:
                linear-gradient(
                    135deg,
                    #00b4db,
                    #5865f2,
                    #8e44ad
                );

            box-shadow:
                0 8px 25px rgba(88, 101, 242, 0.3);

            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(88, 101, 242, 0.45);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        /* Register */

        .register-text {
            text-align: center;
            margin-top: 25px;

            color: #cbd5e1;

            font-size: 14px;
        }

        .register-text a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        /* Home */

        .home-link {
            display: block;
            text-align: center;

            margin-top: 20px;

            color: #94a3b8;

            text-decoration: none;

            font-size: 13px;
        }

        .home-link:hover {
            color: white;
        }

        /* Success Modal */

        .success-overlay {
            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.7);

            display: none;

            justify-content: center;
            align-items: center;

            z-index: 9999;

            backdrop-filter: blur(8px);
        }

        .success-box {
            width: 360px;
            max-width: 90%;

            padding: 35px 25px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(30, 41, 59, 0.95),
                    rgba(49, 46, 129, 0.95)
                );

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 22px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.6);

            animation: popup 0.35s ease;
        }

        @keyframes popup {

            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .success-box h2 {
            margin-bottom: 10px;
            color: #67e8f9;
        }

        .success-box p {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.6;
        }

        .continue-btn {
            margin-top: 22px;

            padding: 12px 25px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #00d4ff,
                #6366f1
            );

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        .continue-btn:hover {
            transform: translateY(-2px);
        }

        /* Error */

        .error-message {
            display: none;

            margin-bottom: 18px;

            padding: 11px;

            border-radius: 10px;

            background: rgba(239, 68, 68, 0.15);

            border: 1px solid rgba(239, 68, 68, 0.35);

            color: #fca5a5;

            font-size: 13px;

            text-align: center;
        }

        /* Mobile */

        @media (max-width: 480px) {

            .login-container {
                padding: 30px 22px;
            }

            h1 {
                font-size: 25px;
            }

            .logo {
                font-size: 35px;
            }

            .options {
                font-size: 12px;
            }
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">
            📊
        </div>

        <h1>DigiMarket</h1>

        <p class="subtitle">
            Digital Marketing Campaign Management
        </p>


        <div id="errorMessage" class="error-message">
            ❌ Invalid Email or Password!
        </div>


        <form id="loginForm">

            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-box">

                    <span>📧</span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >

                </div>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-box">

                    <span>🔒</span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >

                </div>

            </div>


            <!-- Options -->

            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    Remember me

                </label>

                <a
                    href="#"
                    class="forgot"
                    onclick="forgotPassword(); return false;"
                >
                    Forgot Password?
                </a>

            </div>


            <!-- Login -->

            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >
                🔐 Login
            </button>

        </form>


        <div class="register-text">

            Don't have an account?

            <a href="register.html">
                Register Now
            </a>

        </div>


        <a
            href="index.html"
            class="home-link"
        >
            ← Back to Home
        </a>

    </div>


    <!-- Success Popup -->

    <div
        class="success-overlay"
        id="successOverlay"
    >

        <div class="success-box">

            <div class="success-icon">
                🎉
            </div>

            <h2>
                Login Successful!
            </h2>

            <p>
                Welcome back to DigiMarket.<br>
                Your dashboard is ready.
            </p>

            <button
                class="continue-btn"
                onclick="goToDashboard()"
            >
                Go to Dashboard →
            </button>

        </div>

    </div>


    <script>

        /* =====================================
           CHECK EXISTING LOGIN
        ===================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const loggedIn =
                    localStorage.getItem("isLoggedIn");

                if (loggedIn === "true") {

                    /*
                    User already logged in.
                    We don't force redirect automatically.
                    They can still access login page.
                    */

                    console.log(
                        "User is already logged in."
                    );
                }

            }
        );


        /* =====================================
           LOGIN FORM
        ===================================== */

        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    const rememberMe =
                        document
                            .getElementById("rememberMe")
                            .checked;


                    const errorMessage =
                        document
                            .getElementById("errorMessage");


                    const loginButton =
                        document
                            .getElementById("loginButton");


                    /* Hide old error */

                    errorMessage.style.display =
                        "none";


                    /* Loading */

                    loginButton.disabled = true;

                    loginButton.innerHTML =
                        "⏳ Logging in...";


                    try {

                        /* =====================================
                           SEND LOGIN REQUEST TO SERVER
                        ===================================== */

                        const data =
                            new URLSearchParams();

                        data.append(
                            "email",
                            email
                        );

                        data.append(
                            "password",
                            password
                        );


                        const response =
                            await fetch(
                                "/login",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/x-www-form-urlencoded"
                                    },

                                    body:
                                        data.toString()
                                }
                            );


                        const result =
                            await response.text();


                        console.log(
                            "Login response:",
                            result
                        );


                        /* =====================================
                           LOGIN SUCCESS
                        ===================================== */

                        if (response.ok) {

                            /*
                            IMPORTANT:

                            This is what fixes the
                            Dashboard / Campaigns /
                            Reports login problem.
                            */

                            localStorage.setItem(
                                "isLoggedIn",
                                "true"
                            );


                            /*
                            Store basic user information
                            */

                            localStorage.setItem(
                                "user",
                                JSON.stringify({
                                    email: email
                                })
                            );


                            /*
                            Remember me
                            */

                            if (rememberMe) {

                                localStorage.setItem(
                                    "rememberMe",
                                    "true"
                                );

                            } else {

                                localStorage.removeItem(
                                    "rememberMe"
                                );

                            }


                            console.log(
                                "Login state saved:",
                                localStorage.getItem(
                                    "isLoggedIn"
                                )
                            );


                            /* Show success popup */

                            showLoginSuccess();

                        } else {

                            /*
                            Login failed
                            */

                            errorMessage.style.display =
                                "block";

                        }

                    }

                    catch (error) {

                        console.error(
                            "Login error:",
                            error
                        );


                        errorMessage.innerHTML =
                            "⚠️ Server connection failed. Please make sure the server is running.";

                        errorMessage.style.display =
                            "block";

                    }


                    finally {

                        loginButton.disabled =
                            false;

                        loginButton.innerHTML =
                            "🔐 Login";

                    }

                }
            );


        /* =====================================
           SUCCESS POPUP
        ===================================== */

        function showLoginSuccess() {

            const overlay =
                document.getElementById(
                    "successOverlay"
                );

            overlay.style.display =
                "flex";


            /*
            Small glitter effect
            */

            createGlitter();

        }


        /* =====================================
           GO TO DASHBOARD
        ===================================== */

        function goToDashboard() {

            /*
            Make sure login state exists
            before going to dashboard.
            */

            localStorage.setItem(
                "isLoggedIn",
                "true"
            );


            window.location.href =
                "dashboard.html";

        }


        /* =====================================
           FORGOT PASSWORD
        ===================================== */

        function forgotPassword() {

            alert(
                "📧 Please contact the administrator to reset your password."
            );

        }


        /* =====================================
           GLITTER EFFECT
        ===================================== */

        function createGlitter() {

            for (
                let i = 0;
                i < 25;
                i++
            ) {

                const glitter =
                    document.createElement(
                        "div"
                    );


                glitter.innerHTML = "✨";


                glitter.style.position =
                    "fixed";

                glitter.style.left =
                    Math.random() * 100 + "%";

                glitter.style.top =
                    Math.random() * 100 + "%";

                glitter.style.fontSize =
                    Math.random() * 15 + 10 + "px";

                glitter.style.zIndex =
                    "10000";

                glitter.style.pointerEvents =
                    "none";

                glitter.style.animation =
                    "glitterMove 1.5s ease forwards";


                document.body.appendChild(
                    glitter
                );


                setTimeout(
                    function () {

                        glitter.remove();

                    },
                    1500
                );

            }

        }


        /* Glitter animation */

        const glitterStyle =
            document.createElement(
                "style"
            );


        glitterStyle.innerHTML = `

            @keyframes glitterMove {

                0% {

                    opacity: 1;

                    transform:
                        translateY(0)
                        scale(1);

                }

                100% {

                    opacity: 0;

                    transform:
                        translateY(-80px)
                        scale(0.3);

                }

            }

        `;


        document.head.appendChild(
            glitterStyle
        );

    </script>

</body>

</html>
