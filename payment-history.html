<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment History</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            margin:0;
            padding:20px;
        }

        h2{
            text-align:center;
            color:#333;
        }

        table{
            width:90%;
            margin:auto;
            border-collapse:collapse;
            background:#fff;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        th{
            background:#007bff;
            color:white;
            padding:12px;
        }

        td{
            padding:10px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#f1f1f1;
        }

        .btn{
            display:block;
            width:200px;
            margin:30px auto;
            padding:12px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        .btn:hover{
            background:#0056b3;
        }
    </style>
</head>
<body>

<h2>Payment History</h2>

<table id="paymentTable">
    <thead>
        <tr>
            <th>Payment ID</th>
            <th>Campaign Name</th>
            <th>Amount (₹)</th>
            <th>Payment Method</th>
            <th>Status</th>
            <th>Payment Date</th>
        </tr>
    </thead>

    <tbody>

    </tbody>
</table>

<button class="btn" onclick="window.location.href='dashboard.html'">
    Back to Dashboard
</button>

<script>

fetch("/payments")
.then(response => response.json())
.then(data => {

    const tableBody = document.querySelector("#paymentTable tbody");

    tableBody.innerHTML = "";

    data.forEach(payment => {

        const paymentDate = new Date(payment.payment_date).toLocaleString();

        tableBody.innerHTML += `
            <tr>
                <td>${payment.id}</td>
                <td>${payment.campaign_name}</td>
                <td>₹${payment.amount}</td>
                <td>${payment.payment_method}</td>
                <td>${payment.payment_status}</td>
                <td>${paymentDate}</td>
            </tr>
        `;

    });

})
.catch(error => {

    console.log(error);
    alert("Unable to load payment history.");

});

</script>

</body>
</html>
