<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Management | DigiMark</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    color:white;

    background:
        radial-gradient(circle at 10% 10%, #253b80 0%, transparent 32%),
        radial-gradient(circle at 90% 90%, #6a1b9a 0%, transparent 32%),
        linear-gradient(135deg,#07152f,#101c3d,#170d32);
}

/* SIDEBAR */

.sidebar{
    position:fixed;
    left:0;
    top:0;

    width:245px;
    height:100vh;

    padding:28px 18px;

    background:rgba(255,255,255,0.07);
    border-right:1px solid rgba(255,255,255,0.15);

    backdrop-filter:blur(20px);
}

.logo{
    text-align:center;

    font-size:25px;
    font-weight:bold;

    margin-bottom:35px;

    background:linear-gradient(
        90deg,
        #00e5ff,
        #7c4dff,
        #d500f9
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.sidebar a{
    display:block;

    text-decoration:none;

    color:#d8e8ff;

    padding:13px 15px;

    margin:8px 0;

    border-radius:12px;

    transition:0.3s;
}

.sidebar a:hover,
.sidebar a.active{
    color:white;

    background:
        linear-gradient(
            90deg,
            rgba(0,229,255,0.18),
            rgba(124,77,255,0.18)
        );

    border:1px solid rgba(0,229,255,0.25);

    transform:translateX(4px);
}

/* MAIN */

.main{
    margin-left:245px;
    padding:40px;
}

.page-title{
    font-size:32px;
    margin-bottom:8px;
}

.page-subtitle{
    color:#aebbd7;
    margin-bottom:30px;
}

/* TOP CARD */

.user-summary{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:20px;

    margin-bottom:30px;
}

.summary-card{
    padding:25px;

    border-radius:20px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.15);

    backdrop-filter:blur(20px);

    box-shadow:
        0 20px 50px rgba(0,0,0,0.25);
}

.summary-card h3{
    color:#aebbd7;
    font-size:15px;
    margin-bottom:10px;
}

.summary-card p{
    font-size:30px;
    font-weight:bold;

    background:
        linear-gradient(
            90deg,
            #00e5ff,
            #7c4dff,
            #d500f9
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* USER BOX */

.user-box{
    padding:28px;

    border-radius:20px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.15);

    backdrop-filter:blur(20px);

    box-shadow:
        0 20px 50px rgba(0,0,0,0.25);
}

.user-box h2{
    margin-bottom:20px;
}

/* SEARCH */

.search-box{
    margin-bottom:22px;
}

.search-box input{
    width:100%;

    padding:14px 18px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,0.2);

    outline:none;

    background:rgba(0,0,0,0.2);

    color:white;

    font-size:14px;
}

.search-box input::placeholder{
    color:#9daac5;
}

.search-box input:focus{
    border-color:#00e5ff;

    box-shadow:
        0 0 15px rgba(0,229,255,0.15);
}

/* TABLE */

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

.user-table{
    width:100%;

    border-collapse:collapse;

    min-width:700px;
}

.user-table th{
    text-align:left;

    padding:16px;

    color:#00e5ff;

    border-bottom:
        1px solid rgba(255,255,255,0.18);
}

.user-table td{
    padding:17px 16px;

    color:#e5ecff;

    border-bottom:
        1px solid rgba(255,255,255,0.10);
}

.user-table tbody tr{
    transition:0.3s;
}

.user-table tbody tr:hover{
    background:rgba(255,255,255,0.05);
}

/* STATUS */

.status{
    display:inline-block;

    padding:7px 14px;

    border-radius:20px;

    color:#7dffb2;

    background:
        rgba(0,255,120,0.10);

    border:1px solid
        rgba(0,255,120,0.25);

    font-size:12px;

    font-weight:bold;
}

/* EMPTY */

.empty{
    text-align:center;

    padding:35px;

    color:#9faecc;
}

/* BACK BUTTON */

.back-btn{
    display:inline-block;

    margin-top:25px;

    padding:10px 20px;

    border-radius:20px;

    text-decoration:none;

    color:#00e5ff;

    border:1px solid rgba(0,229,255,0.35);

    background:rgba(0,229,255,0.08);

    transition:0.3s;
}

.back-btn:hover{
    color:white;

    background:
        linear-gradient(
            90deg,
            #1976d2,
            #7c4dff
        );

    transform:translateY(-2px);
}

/* MOBILE */

@media(max-width:900px){

    .sidebar{
        position:relative;

        width:100%;
        height:auto;

        padding:15px;

        display:flex;

        flex-wrap:wrap;

        justify-content:center;
    }

    .logo{
        width:100%;
        margin-bottom:12px;
    }

    .sidebar a{
        display:inline-block;

        margin:4px;

        padding:9px 12px;

        font-size:13px;
    }

    .main{
        margin-left:0;

        padding:25px 15px;
    }

    .user-summary{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        🚀 DigiMark
    </div>

    <a href="dashboard.html">
        🏠 Dashboard
    </a>

    <a href="view-campaign.html">
        📢 Campaigns
    </a>

    <a href="budget.html">
        💰 Budget
    </a>

    <a href="reports.html">
        📊 Reports
    </a>

    <a href="payment-history.html">
        💳 Payments
    </a>

    <a href="profile.html">
        👤 Profile
    </a>

    <a href="admin.html">
        ⚙️ Admin
    </a>

    <a href="users.html" class="active">
        👥 Users
    </a>

    <a href="logout.html">
        🚪 Logout
    </a>

</div>


<!-- MAIN -->

<div class="main">

    <h1 class="page-title">
        👥 User Management
    </h1>

    <p class="page-subtitle">
        View and monitor registered users
    </p>


    <!-- SUMMARY -->

    <div class="user-summary">

        <div class="summary-card">

            <h3>
                👥 Total Registered Users
            </h3>

            <p id="totalUsers">
                0
            </p>

        </div>


        <div class="summary-card">

            <h3>
                🟢 System Status
            </h3>

            <p>
                Active
            </p>

        </div>

    </div>


    <!-- USER TABLE -->

    <div class="user-box">

        <h2>
            📋 Registered Users
        </h2>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search by name or email..."
                onkeyup="searchUsers()"
            >

        </div>


        <div class="table-wrapper">

            <table class="user-table">

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Phone
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <tbody id="userTableBody">

                    <tr>

                        <td colspan="5" class="empty">
                            Loading users...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


        <a
            href="admin.html"
            class="back-btn"
        >
            ← Back to Admin
        </a>

    </div>

</div>


<script>

let allUsers = [];


/* ================= LOAD USERS ================= */

function loadUsers(){

    fetch("/users")

    .then(response => {

        if(!response.ok){

            throw new Error("Unable to load users");

        }

        return response.json();

    })

    .then(data => {

        console.log("Users:", data);

        if(Array.isArray(data)){

            allUsers = data;

        }

        else if(Array.isArray(data.users)){

            allUsers = data.users;

        }

        else{

            allUsers = [];

        }


        document.getElementById("totalUsers")
            .innerText = allUsers.length;


        displayUsers(allUsers);

    })

    .catch(error => {

        console.log("Users Error:", error);

        document.getElementById("totalUsers")
            .innerText = "0";


        document.getElementById("userTableBody")
            .innerHTML = `

                <tr>

                    <td
                        colspan="5"
                        class="empty"
                    >
                        ❌ Unable to load users
                    </td>

                </tr>

            `;

    });

}


/* ================= DISPLAY USERS ================= */

function displayUsers(users){

    const tableBody =
        document.getElementById("userTableBody");


    if(users.length === 0){

        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="empty"
                >
                    No users found
                </td>

            </tr>

        `;

        return;

    }


    tableBody.innerHTML = "";


    users.forEach(user => {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${user.id ?? "-"}
            </td>

            <td>
                ${user.fullname ?? user.name ?? "-"}
            </td>

            <td>
                ${user.email ?? "-"}
            </td>

            <td>
                ${user.phone ?? "-"}
            </td>

            <td>
                <span class="status">
                    Active ✅
                </span>
            </td>

        `;


        tableBody.appendChild(row);

    });

}


/* ================= SEARCH ================= */

function searchUsers(){

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const filteredUsers =
        allUsers.filter(user => {

            const name =
                (
                    user.fullname ||
                    user.name ||
                    ""
                ).toLowerCase();


            const email =
                (
                    user.email ||
                    ""
                ).toLowerCase();


            return (
                name.includes(search) ||
                email.includes(search)
            );

        });


    displayUsers(filteredUsers);

}


/* ================= START ================= */

loadUsers();

</script>

</body>
</html>
